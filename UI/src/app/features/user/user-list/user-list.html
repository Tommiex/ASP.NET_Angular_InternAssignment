<div class="p-6 bg-slate-50 min-h-screen">
  <div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-blue-600">Users Dashboard</h1>
      <app-button-component 
        label="Add user +" 
        variant="primary" 
        (btnClick)="openAddUserPopup()">
      </app-button-component>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex gap-4 items-center w-fit">      
      <select (change)="sortUsers($any($event.target).value)" class="border border-slate-200 rounded-lg px-4 py-2 bg-white outline-none">
        <option value="name">Sort by: Name</option>
        <option value="role">Sort by: Role</option>
      </select>
    </div>

    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-100 text-slate-400 text-sm font-semibold">
            <th class="px-6 py-4">Name</th>
            <th class="px-6 py-4">Role</th>
            <th class="px-6 py-4 text-right">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-50">
          @if (isLoading()) {
            <tr><td colspan="3" class="px-6 py-10 text-center text-slate-500">Loading users...</td></tr>
          } @else if (isError()) {
            <tr><td colspan="3" class="px-6 py-10 text-center text-red-500">Error loading data.</td></tr>
          } @else {
            @for (user of value(); track user.id) {
              <tr class="hover:bg-slate-50 transition-colors">
                <td class="px-6 py-4">
                  <div class="flex flex-col">
                    <span class="font-semibold text-slate-800">{{ user.firstName }} {{ user.lastName }}</span>
                    <span class="text-sm text-slate-400">{{ user.email }}</span>
                  </div>
                </td>
                <td class="px-6 py-4">
                  <span class="px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-slate-200 text-slate-600">
                    {{ user.roleType }}
                  </span>
                </td>
                <td class="px-6 py-4 text-right">
                  <div class="flex justify-end gap-3 text-slate-300">
                    <button (click)="openEditPopup(user)" class="hover:text-blue-500 transition-colors">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
                    </button>
                    <button (click)="deleteUser(user.id)" class="hover:text-red-500 transition-colors">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
                    </button>
                  </div>
                </td>
              </tr>
            }
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

@if (isPopupVisible) {
  <app-ad-user-popup 
    [selectedUser]="selectedUserForEdit" 
    (close)="closePopup()" 
    (userAdded)="refreshList()"> 
  </app-ad-user-popup>
}
