<button
  [type]="type"
  (click)="onClick()"
  [ngClass]="{
    'bg-blue-600 hover:bg-blue-700 text-white': variant === 'primary',
    'bg-gray-200 hover:bg-gray-300 text-gray-800': variant === 'secondary',
    'bg-red-600 hover:bg-red-700 text-white': variant === 'danger'
  }"
  class="px-4 py-2 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 shadow-sm"
>
  {{ label }}
</button>
